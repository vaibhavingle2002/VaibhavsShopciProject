services:

  # ==========================
  # MySQL Database
  # ==========================
  mysql:
    image: mysql:8.0
    container_name: shopci-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - shopci-network


  # ==========================
  # Backend - Node.js
  # ==========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: shopci-backend

    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: ecommerce_db
      JWT_SECRET: change_this_to_a_secure_secret
      PORT: 5000
      NODE_ENV: production

    ports:
      - "5000:5000"

    depends_on:
      - mysql

    networks:
      - shopci-network


  # ==========================
  # Frontend - React + Nginx
  # ==========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: shopci-frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - shopci-network


# ==========================
# Persistent MySQL Storage
# ==========================
volumes:
  mysql_data:


# ==========================
# Application Network
# ==========================
networks:
  shopci-network:
    driver: bridge
