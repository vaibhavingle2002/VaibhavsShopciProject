services:

  mysql:
    image: mysql:8.0
    container_name: shopci-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - shopci-network

    ports:
      - "3306:3306"

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    image: vaibhavingle2018/shopci-backend:local

    container_name: shopci-backend
    restart: unless-stopped

    environment:
      PORT: ${PORT}
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "5000:5000"

    networks:
      - shopci-network


  frontend:
    build:
      context: ./frontend

    image: vaibhavingle2018/shopci-frontend:local

    container_name: shopci-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"

    networks:
      - shopci-network


volumes:
  mysql_data:


networks:
  shopci-network:
